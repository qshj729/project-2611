name: Build Tunnel APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# 只读仓库，不需要写权限
permissions:
  contents: read

# 同一 tag / 分支的新 push 取消旧 run
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建隧道版 Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        # Gradle 工程在 android/ 下，所有 gradle 命令都从这里跑
        working-directory: android

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 预接受 Android SDK 许可证
        run: |
          mkdir -p /usr/local/lib/android/sdk/licenses
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee" > /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > /usr/local/lib/android/sdk/licenses/android-sdk-preview-license
          echo -e "8933bad161b41f9b1f7d7d6c6d5c6d5c6d5c6d5c" > /usr/local/lib/android/sdk/licenses/android-googletv-license
          echo -e "601085b94cd77f0b54ff86406957099ebe79c4d6" > /usr/local/lib/android/sdk/licenses/android-tv-license
          echo -e "d56f5187479451eabf01fb78af6dfcb131a6481e" > /usr/local/lib/android/sdk/licenses/android-auto-license

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37 build-tools;37.0.0
          accept-android-sdk-licenses: true

      - name: 准备 Gradle（缓存依赖与构建缓存）
        uses: gradle/actions/setup-gradle@v3
        with:
          working-directory: android

      - name: 校验 Gradle Wrapper
        # 1) 官方 checksum 校验（wrapper jar 必须与 Gradle 发布的官方产物一致）
        uses: gradle/wrapper-validation-action@v2
        with:
          gradle-version: '8.11.1'

      - name: 构建隧道版 Debug APK
        # 与本地 `scripts/build.sh :app:assembleDebug` 完全同命令
        working-directory: .
        run: scripts/build.sh :app:assembleDebug

      - name: 上传隧道版 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hubdeck-tunnel-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error