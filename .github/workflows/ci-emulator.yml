name: CI Emulator

# 通道 E：GitHub Actions 里的 Android 模拟器（**手动备用通道**）。
# 2026-11-13 CEO 决策：本地编译环境已下线，本仓库不再在本机构建，
# 构建 / 单测 / Lint / 界面截图全部以本仓库的 Actions 结果为准。
# 2026-11-19 更新：仅里程碑/手动/主分支跑，PR 不再自动跑（省 runner-min，避免 TCG 假红）。
# 2026-11-21 更新：主分支也不再自动跑。托管 runner 无 /dev/kvm，只能 TCG 软模拟，
#   实测冷启动 ~12 分钟、单轮 30–120 分钟、5 轮仅 1 轮跑通取证，且有被平台 shutdown 强杀的风险。
#   设备验收改由真机承担（见项目文档区 design.md §7.6.2）；
#   本 workflow 保留为手动备用，需要补充环境时用 workflow_dispatch 触发。
#
# 产物（artifact）就是验收证据：
#   hubdeck-emulator-apk     —— 被测 APK
#   hubdeck-emulator-shots   —— 截图 + UI 树 + logcat
#   hubdeck-build-logs       —— 构建日志

on:
  # 仅手动触发：设备验收已改走真机通道
  workflow_dispatch:

# 同一分支的新 push 取消旧 run
concurrency:
  group: ci-emulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    name: 模拟器启动 + 截图取证
    runs-on: ubuntu-latest
    # 该 runner 没有 /dev/kvm，模拟器走纯软件模拟（TCG）：
    # 冷启动 ~7 分钟 + install ~4 分钟 + 等焦点数分钟，45 分钟不够用
    timeout-minutes: 75

    env:
      # emulator 检测到 -accel off 且无硬件加速时会直接拒绝启动，
      # 必须显式同意降级到 TCG 纯软件模拟，否则模拟器根本起不来
      # （表现为 adb: device 'emulator-5554' not found）
      ANDROID_I_WANT_MY_TCG: 'yes'

    defaults:
      run:
        working-directory: android

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0
          cmdline-tools-version: 'latest'
          accept-android-sdk-licenses: true

      - name: 准备 Gradle（缓存依赖与构建缓存）
        uses: gradle/actions/setup-gradle@v3
        with:
          working-directory: android

      - name: 校验 Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2
        with:
          gradle-version: '8.11.1'
          allow-checksums: '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046'

      - name: 构建 Debug APK（唯一构建入口）
        working-directory: .
        run: scripts/build.sh :app:assembleDebug

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hubdeck-build-logs
          path: .build-logs/
          if-no-files-found: warn
          retention-days: 30

      - name: 启动模拟器并取证
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # 软模拟下机器很慢，给足开机时间；内存/核数按 runner 实际配额来
          emulator-boot-timeout: 1200
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
            -memory 3072 -cores 2 -no-passive-gps
          # 必须在 emulator-runner 的 script 内部跑：它会在 script 结束后关掉模拟器，
          # 放到工作流的后续步骤里会直接 "No connected devices!"（2026-11-21 实测）。
          # 先取证（截图 / UI 树 / logcat），再跑 UI 测试——取证是门禁，UI 测试慢且易超时。
          script: |
            scripts/ci-emulator-probe.sh
            cd android && ./gradlew connectedDebugAndroidTest --max-workers=1

      - name: 收集截图 / UI 树 / logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hubdeck-emulator-shots
          path: emulator-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: 上传被测 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hubdeck-emulator-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30