name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI 只读仓库，不需要写权限
permissions:
  contents: read

# 同一分支的新 push 取消旧 run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 / 单测 / Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        # Gradle 工程在 android/ 下，所有 gradle 命令都从这里跑
        working-directory: android

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0

      - name: 准备 Gradle（缓存依赖与构建缓存）
        uses: gradle/actions/setup-gradle@v3
        with:
          working-directory: android

      - name: 校验 Gradle Wrapper
        # 1) 官方 checksum 校验（wrapper jar 必须与 Gradle 发布的官方产物一致）
        # 2) 允许本地 wrapper jar sha256（Gradle 8.11.1 官方库暂未收录该版本 wrapper 校验和）
        uses: gradle/wrapper-validation-action@v2
        with:
          gradle-version: '8.11.1'
          allow-checksums: '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046'

      - name: 校验 Wrapper 与仓库一致 + 列出模块
        run: |
          # 重新生成 wrapper，若与仓库里提交的不一致则 git diff 非空 → 步骤失败
          # 网络抖动（插件仓库解析失败、缓存服务 400）会让这一个步骤随机变红，
          # 2026-11-13 实测 run 43416506396 因此假红 → 这里只对该步骤重试 3 次。
          ok=0
          for attempt in 1 2 3; do
            if ./gradlew wrapper --gradle-version 8.11.1 && ./gradlew projects; then
              ok=1
              break
            fi
            echo "::warning::gradle 解析失败（第 $attempt 次），10 秒后重试"
            sleep 10
          done
          [ "$ok" = "1" ] || exit 1
          git diff --exit-code -- gradle/wrapper gradlew gradlew.bat

      - name: 校验 :core:model 是纯 Kotlin 模块（不依赖 Android SDK）
        run: |
          ./gradlew :core:model:dependencies --configuration runtimeClasspath > model-deps.txt
          cat model-deps.txt
          if grep -Eiq 'androidx|com\.android' model-deps.txt; then
            echo "::error:::core:model 依赖了 Android SDK 库，违反 docs/contracts.md §6"
            exit 1
          fi

      - name: 构建 + 单测 + Lint
        # testDebugUnitTest 用聚合写法：会跑所有模块的单测任务。
        # 不要再写成 :app:testDebugUnitTest —— 测试已搬到模块内，那个任务是 NO-SOURCE，
        # 会造成「绿灯但单测没跑」（2026-11-13 实测，见 scripts/ci-verify-tests.sh）。
        working-directory: .
        run: scripts/build.sh :app:assembleDebug testDebugUnitTest :app:lintDebug

      - name: 校验单测真的执行了（防 NO-SOURCE 假绿）
        working-directory: .
        run: bash scripts/ci-verify-tests.sh

      - name: 上传 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hubdeck-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 上传单测与 Lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hubdeck-reports
          path: |
            android/**/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
