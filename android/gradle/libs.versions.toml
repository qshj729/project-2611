[versions]
agp = "8.10.0"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
composeBom = "2024.12.01"
hilt = "2.52"
hiltNavigationCompose = "1.2.0"
room = "2.6.1"
okhttp = "4.12.0"
serialization = "1.7.3"
kaml = "0.61.0"
datastore = "1.1.1"
work = "2.10.0"
coil = "2.7.0"
lifecycle = "2.8.7"
navigation = "2.8.5"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
browser = "1.8.0"
webkit = "1.18.0"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"
mockWebServer = "4.12.0"
coroutines = "1.9.0"
klethronTsnet = "0.14.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version = "1.7.6" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kaml = { module = "com.charleskorn.kaml:kaml", version.ref = "kaml" }

datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
klethron-tsnet = { module = "com.klethron:tsnet", version.ref = "klethronTsnet" }
gson = { module = "com.google.code.gson:gson", version = "2.11.0" }

junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockWebServer" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

# ---------------------------------------------------------------------------
# 模块级依赖声明（docs/design.md §7.2）
#
# 每个 bundle 对应一个 Gradle 模块的"标准依赖集合"，模块自己的 build.gradle.kts
# 只引用 bundle + 本模块特有的依赖，避免版本漂移。
# 注意：Compose BOM 需要 `platform(libs.compose.bom)`，无法放进 bundle，由各模块单独声明。
# ---------------------------------------------------------------------------

[bundles]
# :core:data —— Room + 导入导出 + DataStore
core-data = [
    "room-runtime",
    "room-ktx",
    "datastore-preferences",
    "kotlinx-serialization-json",
    "kaml",
]

# :core:network —— OkHttp 客户端 + 探测器
core-network = [
    "okhttp",
    "okhttp-logging",
    "kotlinx-serialization-json",
    "kotlinx-coroutines-core",
]

# :core:tailscale —— Local API / 控制平面客户端
core-tailscale = [
    "okhttp",
    "kotlinx-serialization-json",
    "kotlinx-coroutines-core",
]

# Compose 界面依赖（:feature:* 与 :app 共用）
compose-runtime = [
    "compose-ui",
    "compose-ui-graphics",
    "compose-ui-tooling-preview",
    "compose-material3",
    "compose-material-icons-extended",
]

# :feature:* 共用的 ViewModel / 生命周期依赖
feature-viewmodel = [
    "androidx-lifecycle-viewmodel-compose",
    "androidx-lifecycle-runtime-compose",
    "androidx-lifecycle-runtime-ktx",
]

# :feature:* 共用的 Hilt / 导航依赖
feature-hilt = [
    "hilt-android",
    "hilt-navigation-compose",
]

# :app 装配壳的通用依赖
app-runtime = [
    "androidx-core-ktx",
    "androidx-activity-compose",
    "androidx-browser",
    "androidx-navigation-compose",
    "androidx-lifecycle-runtime-ktx",
    "androidx-lifecycle-viewmodel-compose",
    "androidx-lifecycle-runtime-compose",
    "coil-compose",
    "work-runtime-ktx",
    "coroutines-android",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
