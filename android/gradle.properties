# 内存上限：整台机器只有 5.9GB RAM，还要跑 Paperclip 服务 + postgres + 多个 agent 进程。
# Gradle daemon 与 Kotlin daemon 各自是独立 JVM，不封顶会被 OOM killer 干掉（表现为
# adapter_failed / process_lost）。封顶 + 限制 worker 数是并行协作的前提。
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
